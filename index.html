<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Surprise ❤️</title>
</head>

<body style="margin:0;font-family:Arial;background:#fff0f6;">

<!-- PAGE 1 -->
<div id="page1" style="display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;">

<div style="max-width:500px;width:100%;background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.15);text-align:center;">

<h1 style="color:#e91e63;">❤️ A Special Surprise ❤️</h1>

<p>Hi Bachha... 🌸</p>

<p>
Before you continue, please enter the password.
</p>

<input id="password" type="password" placeholder="Enter Password"
style="width:90%;padding:15px;font-size:18px;border-radius:10px;border:1px solid #ccc;">

<br><br>

<button type="button"
onclick="checkPassword()"
style="padding:15px 35px;font-size:18px;background:#e91e63;color:white;border:none;border-radius:30px;">
Unlock ❤️
</button>

<p id="error" style="color:red;"></p>

</div>

</div>


<!-- PAGE 2 -->

<div id="page2" style="display:none;padding:30px;background:#fff4f8;min-height:100vh;">

<h1 style="color:#e91e63;text-align:center;">
💌 Page 2 Open Ho Gaya ❤️
</h1>

<p style="font-size:20px;line-height:2;">

Congratulations... ❤️

Agar tum ye dekh pa rahi ho...

To password successfully work kar raha hai.

Ab hum isi page ko baad me ek beautiful love letter me badal denge.

</p>

</div>


<script>

function checkPassword(){

var pass=document.getElementById("password").value.trim();

if(pass==="bachha"){

document.getElementById("page1").style.display="none";

document.getElementById("page2").style.display="block";

}else{

document.getElementById("error").innerHTML="Wrong Password ❤️";

}

}

</script>

</body>
</html>
