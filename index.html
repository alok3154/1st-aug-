  <title>Happy Girlfriend's Day ❤️</title>

  <style>
    body{
      margin:0;
      background:linear-gradient(135deg,#ffd6e7,#fff5f7);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      font-family:Arial,sans-serif;
      text-align:center;
    }

    .box{
      background:white;
      padding:30px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.15);
      width:90%;
      max-width:350px;
    }

    h1{
      color:#ff2d75;
    }

    p{
      color:#555;
    }

    button{
      background:#ff2d75;
      color:white;
      border:none;
      padding:12px 25px;
      border-radius:30px;
      font-size:18px;
      cursor:pointer;
    }

    button:hover{
      background:#e6005c;
    }
  </style>
</head>

<body>

<div class="box">
<h1>❤️ Happy Girlfriend's Day ❤️</h1>

</html>
